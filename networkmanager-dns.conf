# NetworkManager drop-in (manjaro only), installed by bootstrap.sh to
# /etc/NetworkManager/conf.d/dns.conf.
#
# NM and tailscaled both want to write /etc/resolv.conf: NM for the Wi-Fi's
# resolvers, tailscaled for 100.100.100.100 (MagicDNS, which is what resolves
# popos.tail224067.ts.net). Manjaro's default rc-manager=symlink has NM write
# the file directly, and tailscaled picks its strategy from the header it
# finds at startup: NM's header -> "direct" mode (rename the file, write its
# own, restore on clean shutdown); a header mentioning "resolvconf" ->
# openresolv mode. tailscaled's own header contains the URL
# tailscale.com/s/resolvconf-overwrite, so after an unclean shutdown the next
# boot misreads the leftover file, lands in openresolv mode, and openresolv
# then refuses to touch the file NM wrote ("signature mismatch"): MagicDNS
# silently stops.
#
# With rc-manager=resolvconf, NM hands its resolvers to openresolv, which owns
# the file with its own signature on every boot. tailscaled then always picks
# openresolv mode and its exclusive entry wins while up; nothing depends on
# what the previous boot left behind.
[main]
rc-manager=resolvconf
