; Flameshot v14 routes every capture through the org.freedesktop.portal.Screenshot
; XDG portal by DEFAULT, on X11 as well as Wayland. No installed portal backend on
; this machine implements that interface (gtk.portal declares FileChooser/Print/
; Notification/... only, and is UseIn=gnome anyway), so each capture hung for 30s
; and then failed:
;
;   flameshot: error: Screenshot portal timed out after 30 seconds
;   flameshot: error: Unable to capture screen
;
; which broke all four i3 screenshot bindings (Mod4+Shift+3/4, Ctrl+Mod4+Shift+3/4).
; useX11LegacyScreenshot bypasses the portal and uses Qt's native X11 grab instead;
; flameshot's own description of the option names i3 as a case that needs it. The
; setting is ignored on Wayland, so it is harmless if this file is ever stowed there.
;
; NOTE: this file is written by QSettings, which drops comments when Flameshot saves
; its own settings (e.g. from the tray GUI). If these comments disappear, that is why.
[General]
useX11LegacyScreenshot=true
