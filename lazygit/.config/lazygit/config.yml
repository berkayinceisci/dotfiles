os:
  editPreset: 'nvim'

gui:
  theme:
    selectedLineBgColor:
      - underline
git:
  diffRenderers:
    - colorArg: always
      command: delta --dark --paging=never

keybinding:
  universal:
    quit-alt1: ''
    return: '<c-o>' # return to previous menu, will quit if there's nowhere to return
    copyToClipboard: '<c-c>'
