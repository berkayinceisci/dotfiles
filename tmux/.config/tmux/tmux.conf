# Update SSH/display env vars when attaching from a new client. Covers both
# X11 (DISPLAY, XAUTHORITY) and Wayland (WAYLAND_DISPLAY), plus DBus for
# xdg-open-style helpers and the SSH-related vars used by xopen.
set -g update-environment "DISPLAY WAYLAND_DISPLAY XAUTHORITY DBUS_SESSION_BUS_ADDRESS SSH_CONNECTION SSH_CLIENT SSH_TTY LC_OPEN_HOST"

set -g mouse on
set -sg escape-time 0
# Status-bar alerts: bell only, never activity. monitor-activity fires on ANY
# output, so a window running an agent, lazygit, htop or a tail is highlighted
# permanently and the highlight stops meaning anything. The bell is an explicit
# one-shot attention request -- see ~/.agents/hooks/tmux-bell-on-stop.sh, which
# rings it when Claude Code finishes a response. tmux clears the flag by itself
# when the window is next selected. monitor-bell defaults to on; set explicitly
# because it is load-bearing here.
setw -g monitor-activity off
setw -g monitor-bell on
# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000
# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# set -g default-terminal 'tmux-256color'
set -g default-terminal 'screen-256color'
set -sa terminal-features ',xterm-256color:RGB:clipboard'
set -s set-clipboard on

# Claude code changes appear on nvim buffer upon a pane switch: tmux only
# forwards the terminal's focus events to the pane when this is on, and nvim's
# FocusGained autocmd (config/autocmds.lua) is what runs :checktime and reloads
# a buffer Claude edited. Without it the buffer stays stale until the next
# keypress.
#
# This used to be paired with a pane-focus-out hook that briefly disabled
# monitor-activity, because the focus handshake makes the departing pane redraw
# and that redraw counted as activity. Activity monitoring is off entirely now
# (see the alerts block above), so the handshake has nothing left to trip and
# the hook is gone.
set -g focus-events on

if-shell 'test -f /usr/bin/zsh' \
    'set-option -g default-shell /usr/bin/zsh' \
    'if-shell "test -f ~/.local/bin/zsh" "set-option -g default-shell ~/.local/bin/zsh" "set-option -g default-shell /bin/zsh"'

setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

bind-key C-h previous-window
bind-key C-l next-window
bind-key C-j swap-window -t -1 \; previous-window
bind-key C-k swap-window -t +1 \; next-window

set-option -g renumber-windows on

# reload tmux config
bind-key r source-file ~/.config/tmux/tmux.conf

# toggle status bar
bind-key b set-option status

# Add a blank padding line between the status bar and the shell prompt.
# Snapshot the active status-format template into [1] (the lower line, holds
# the visible bar) and clear [0] (the upper line, becomes the gap).
#
# Gate the snapshot on a marker user-option: on `prefix r` the config is
# re-sourced, but by then status-format[0] is already '', so a naive re-snapshot
# would wipe out [1] and the bar would disappear. The marker makes the snapshot
# fire exactly once per tmux server lifetime. Re-snapshot manually with:
#   tmux set -gu @status-padding-applied ; tmux source-file ~/.config/tmux/tmux.conf
if-shell '[ -z "$(tmux show-option -gqv @status-padding-applied)" ]' \
    "set -Fg 'status-format[1]' '#{status-format[0]}' ; set -g @status-padding-applied yes"
set -g 'status-format[0]' ''
set -g status 2

# Vim aware pane switching
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-w if-shell "$is_vim" "send-keys C-w" "switch-client -T vimtable"

# The two bindings below gate on which program owns the pane, and they use
# `if-shell -F` with a #{pane_current_command} format rather than the `ps`
# pipeline that is_vim above uses. -F is evaluated by tmux itself, so it costs no
# fork -- which matters because these sit on the hot path of every Ctrl+Backspace
# in every pane. pane_current_command is derived from the pane tty's foreground
# process group, i.e. the same thing `ps -o comm= -t '#{pane_tty}'` reads. is_vim
# keeps the `ps` form because it matches a regex over many binary names and
# filters on process state; an exact single name needs neither.

# Ctrl+Backspace = delete previous word, in Claude Code and lazygit too. Two
# bindings cover it because the byte depends on the terminal: WezTerm pins
# Ctrl+Backspace to ESC DEL (wezterm.lua), which tmux names M-BSpace, while
# terminals that do no such pinning still send legacy ^H (0x08).
#
# Claude Code reads a bare ^H as a one-char backspace; its word-delete is Ctrl+W
# (0x17). So in claude panes, inject C-w: send-keys writes the byte straight into
# the pane and bypasses the root C-w binding above, so it reaches CC as
# deleteWordBefore without hitting vimtable. On the WezTerm path CC receives ESC
# DEL and handles it natively, so M-BSpace needs no claude branch.
#
# lazygit needs its own treatment: its text inputs are gocui's, and gocui/tcell
# fold both ^H and DEL into a plain Backspace, so lazygit deletes a single char
# either way; ESC DEL it ignores outright. Inject the CSI-u encoding of
# Ctrl+Backspace instead -- \e[127;5u (1b 5b 31 32 37 3b 35 75) -- which its
# editor decodes as word-delete. Not `send-keys C-w`, which lazygit also accepts
# in a text input: <c-w> is bound globally to toggleWhitespaceInDiffView, so
# pressing Ctrl+Backspace outside a text input would silently flip that setting,
# whereas \e[127;5u is inert there.
#
# Ctrl+Left / Ctrl+Right need no binding at all: lazygit parses \e[1;5D / \e[1;5C
# natively. It could not before 0.64 -- tcell only learned those xterm-style
# modified-cursor sequences from terminfo's kLFT5/kRIT5 caps, absent from our
# screen-256color default-terminal above -- so this block used to translate them
# to Alt+Left/Alt+Right, which 0.64 in turn ignores. Requires lazygit >= 0.64 on
# every machine that stows this repo.
#
# Every other pane re-sends the key unchanged (zsh: backward-kill-word via
# `bindkey '^H'`, and via the emacs keymap's default `^[^?`; nvim: <C-H> and
# <M-BS> -> <C-w>) so their existing Ctrl+Backspace keeps working. The M-BSpace
# fallthrough has to respell the bytes as `-H 1b 7f` rather than `send-keys
# M-BSpace`: tmux 3.7 emits nothing at all for the latter, unlike `send-keys C-h`.
#
# lazygit running *inside* nvim (lazygit.nvim's floating terminal) is one of
# those panes -- pane_current_command is nvim there, so the gate cannot see it;
# that case is translated on the nvim side, by the FileType autocmd in nvim's
# lua/plugins/lazygit.lua.
bind-key -n C-h if-shell -F "#{==:#{pane_current_command},lazygit}" "send-keys -H 1b 5b 31 32 37 3b 35 75" {
    if-shell -F "#{==:#{pane_current_command},claude}" "send-keys C-w" "send-keys C-h"
}
bind-key -n M-BSpace if-shell -F "#{==:#{pane_current_command},lazygit}" "send-keys -H 1b 5b 31 32 37 3b 35 75" "send-keys -H 1b 7f"

bind-key -T vimtable C-h select-pane -L \; switch-client -T root
bind-key -T vimtable C-j select-pane -D \; switch-client -T root
bind-key -T vimtable C-k select-pane -U \; switch-client -T root
bind-key -T vimtable C-l select-pane -R \; switch-client -T root
bind-key -T vimtable h select-pane -L \; switch-client -T root
bind-key -T vimtable j select-pane -D \; switch-client -T root
bind-key -T vimtable k select-pane -U \; switch-client -T root
bind-key -T vimtable l select-pane -R \; switch-client -T root

# Vim aware pane resizing
bind-key -n C-S-Left if-shell "$is_vim" 'send-keys C-S-Left' 'resize-pane -L 3'
bind-key -n C-S-Down if-shell "$is_vim" 'send-keys C-S-Down' 'resize-pane -D 3'
bind-key -n C-S-Up if-shell "$is_vim" 'send-keys C-S-Up' 'resize-pane -U 3'
bind-key -n C-S-Right if-shell "$is_vim" 'send-keys C-S-Right' 'resize-pane -R 3'

# Plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-dir "~/.config/tmux/resurrect"
# Restore each pane's visible text (screenshot of the screen at save time, not
# full scrollback; replayed as dead output, so not in shell history). NB: the
# capture lands unencrypted in the resurrect dir — anything on screen (tokens,
# env output) is written to disk. The dir is gitignored, so it never leaks
# into the repo.
set -g @resurrect-capture-pane-contents 'on'
# Additional programs to relaunch on restore (adds to resurrect's default
# whitelist). `~` matches a saved command that has arguments; `-> lazygit *`
# relaunches it with the saved arguments (e.g. lgit's --use-config-dir).
set -g @resurrect-processes '"~lazygit->lazygit *"'

# Restore Claude Code sessions per-pane. Base tmux-resurrect only re-launches a
# whitelist of programs (editors/pagers/top/htop) — NOT claude — so restored
# panes came back as empty shells. This plugin records each pane's claude
# session id (via a Claude Code SessionStart hook that writes a claude-<PID>.json
# state file) and rebuilds `claude --resume <id>` on restore. Capture
# CLAUDE_CONFIG_DIR so moatlab panes resume against the right profile.
# NB: the plugin rewrites the SessionStart/SessionEnd hooks in
# ~/.claude/settings.json (default profile only) on every tmux config load,
# with a machine-specific absolute path. Do NOT hand-fix that: the
# "claude-settings" git clean filter normalizes it, see .gitattributes.
# claude-moatlab is untouched by the plugin, so its hooks stay hand-wired.
set -g @plugin 'timvw/tmux-assistant-resurrect'
set -g @assistant-resurrect-capture-env 'CLAUDE_CONFIG_DIR'

set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @minimal-tmux-right false
set -g @minimal-tmux-left false
set -g @minimal-tmux-justify "left"
set -g @minimal-tmux-status-right-extra "#h | #(echo '#{pane_current_path}' | sed 's#$HOME#~#; s#\\([^/]*/[^/]*/\\).*\\(/[^/]*/.*\\)$#\\1 ... \\2#; s#/#/#g')"
# Refresh 'status-left' and 'status-right' more often, from every 15s to 1s
set -g status-interval 1

# tmux-continuum MUST be the LAST plugin. It enables auto-save by appending a
# hidden #(continuum_save.sh) hook to status-right; any status plugin loaded
# AFTER it (minimal-tmux-status) overwrites status-right and silently kills
# auto-save. Keeping it below minimal-tmux-status preserves the hook.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Save on every window close, so restore reflects deliberate exits: closing
# tabs updates the snapshot (removing the `last` pointer when the final window
# goes — see save-on-close.sh for why an empty save must never be written),
# instead of continuum's periodic save resurrecting hand-closed windows.
# window-unlinked fires AFTER the window is removed (covers both `exit` and
# kill-window) and does NOT fire on SIGTERM/SIGKILL (reboot/shutdown), so the
# last periodic snapshot still restores the session after a reboot.
# run-shell is synchronous on purpose: with exit-empty the server dies right
# after the last window closes, and a backgrounded (-b) save could be cut off.
set-hook -g window-unlinked "run-shell '~/.config/tmux/save-on-close.sh'"

# `tmux kill-server` should PRESERVE the working state (like a reboot), not
# write an empty save: during kill-server the window-unlinked hook fires with
# an already-empty window list, which would clobber the good snapshot. Shadow
# the built-in via command-alias: save the full state, drop the hook, then
# really kill. The trailing `kill-ser` is the unambiguous command prefix — it
# bypasses alias lookup (aliases match exact names only), avoiding recursion.
set -s 'command-alias[100]' "kill-server=run-shell '~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh quiet' ; set-hook -gu window-unlinked ; kill-ser"

# Initialize TMUX plugin manager (keep this line at the very bottom of
# tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
