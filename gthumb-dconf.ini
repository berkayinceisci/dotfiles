# gThumb settings, applied by bootstrap.sh via `dconf load /org/gnome/gthumb/`.
#
# Why this exists: gThumb litters every browsed image folder with a `.comments/`
# directory of `<filename>.xml` sidecars -- even when no comment was ever typed.
# Two independent code paths create them, so both are shut off here.
#
# 1. `comments/synchronize` (the "Synchronize with the embedded metadata"
#    checkbox). With it on, gThumb's `read-metadata-ready` hook fires just from
#    OPENING a folder: for every file with no sidecar yet, it compares embedded
#    Exif/IPTC/XMP against the (empty) sidecar and writes one if they differ.
#    iPhone screenshots carry Exif UserComment="Screenshot", which maps to
#    general::description -> <note>, so a whole folder gets sidecars on sight.
#    Merely browsing was enough; no rename or edit required.
#
# 2. The `comments` extension itself. Its metadata provider's write function
#    (gth_metadata_provider_comment_write) has NO empty-field check and does NOT
#    consult `synchronize` -- it mkdirs `.comments/` and writes unconditionally
#    whenever metadata is saved. So knob 1 alone still leaves that path open;
#    dropping the extension from active-extensions is what actually closes it.
#    Nothing else Requires= it, and gThumb keeps reading/writing embedded
#    metadata through exiv2_tools. The only loss is the sidecar-backed comment
#    and tag UI, which was never used -- all 41 sidecars on this machine held
#    only Exif-derived junk ("Screenshot", iOS asset UUIDs), no typed content.
#
# active-extensions is pinned as a full list because that is how the key is
# typed (a string array); to refresh it after a gThumb upgrade, re-dump with
# `gsettings get org.gnome.gthumb.general active-extensions` and drop 'comments'.
#
# `dconf load` merges -- keys not listed here are left alone.

[comments]
synchronize=false

[general]
active-extensions=['23hq', 'bookmarks', 'burn_disc', 'catalogs', 'change_date', 'contact_sheet', 'convert_format', 'desktop_background', 'edit_metadata', 'exiv2_tools', 'file_manager', 'find_duplicates', 'flicker', 'gstreamer_tools', 'gstreamer_utils', 'image_print', 'image_rotation', 'importer', 'jpeg_utils', 'list_tools', 'oauth', 'photo_importer', 'raw_files', 'red_eye_removal', 'rename_series', 'resize_images', 'search', 'selections', 'slideshow', 'terminal', 'webalbums']
