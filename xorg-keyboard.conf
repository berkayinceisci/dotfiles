# X keyboard layout: us + tr, switched with Win+Space.
#
# Installed by ~/dotfiles/bootstrap.sh to
# /etc/X11/xorg.conf.d/99-keyboard-layout.conf -- edit this copy and re-run
# bootstrap.sh, never the file under /etc.
#
# Why a config file instead of only the runtime `setxkbmap` call in
# i3/.config/i3/xsettings.sh: X applies matching InputClass sections to every
# input device as it is added, so this is the only form of the layout that
# survives a device re-enumeration. setxkbmap is one-shot state -- a udev reload
# (pacman's 35-systemd-udev-reload.hook fires on most -Syu runs) or an external
# keyboard being plugged in re-adds every keyboard and silently drops the layout
# back to a bare "us", after which Win+Space stops switching.
#
# Why our own 99- file rather than the distro's own keyboard config: the backing
# file differs per distro. Manjaro's systemd-localed writes
# /etc/X11/xorg.conf.d/00-keyboard.conf (which X reads), while on Pop!_OS 24.04
# localectl writes /etc/default/keyboard and leaves /etc/X11/xorg.conf.d empty
# (which X does not read). Shipping our own section keeps ONE mechanism for
# both. xorg.conf(5) on ordering: "Each class can override settings from a
# previous class", so the 99- prefix wins over anything the distro put in 00-.
#
# Model and variant are deliberately unset so X's own defaults apply and nothing
# machine-specific is pinned into a system-wide file.
#
# NOTE: this covers the LAYOUT only. `xset r rate` in xsettings.sh is XKB
# *control* state rather than device configuration -- libinput has no
# AutoRepeat InputClass option -- so the repeat rate is still lost on every
# re-add and is restored only by re-running xsettings.sh.
Section "InputClass"
    Identifier "dotfiles-keyboard-layout"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us,tr"
    Option "XkbOptions" "grp:win_space_toggle"
EndSection
