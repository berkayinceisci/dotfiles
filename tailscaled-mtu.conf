# systemd drop-in for tailscaled.service (manjaro only), installed by
# bootstrap.sh to /etc/systemd/system/tailscaled.service.d/mtu.conf.
#
# Lowers the tailscale0 MTU from Tailscale's 1280 to 1200. On the home Wi-Fi
# (Netgear C3700v2) the direct path from this laptop to popos silently drops
# tunnel packets above ~1213 bytes in both directions, with no ICMP back, so
# PMTU discovery never kicks in. Small packets pass, so `tailscale ping` and
# already-running mosh sessions look fine, while every new ssh -- and so every
# new `mosh popos`, whose bootstrap is ssh -- hangs at
#     debug1: expecting SSH2_MSG_KEX_ECDH_REPLY
# (the first large packet the server sends). Diagnosed 2026-10-15:
#   - DF pings to popos over tailscale: 1185-byte payload passes, 1200 fails;
#     from popos to this laptop the same.
#   - Same network, same popos endpoint, the Mac passes 1252 -- the Mac reaches
#     popos through its UPnP port forward, this laptop through plain NAT on
#     41641. Large packets to the Mac over the LAN, and 1500-byte pings to the
#     internet, both pass, so neither this laptop nor the router in general is
#     at fault; the exact cause on the router is not proven.
# With MTU 1200, ssh (incl. a 270 KB transfer) and `mosh popos` both work.
#
# ExecStartPost runs once tailscaled reports ready (Type=notify), by which
# point tailscale0 exists.
[Service]
ExecStartPost=/usr/bin/ip link set dev tailscale0 mtu 1200
